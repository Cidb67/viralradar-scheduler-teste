name: ViralRadar - Diagnostico de raciocinio Nemotron
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Validar sintaxe
        run: python -m py_compile diagnostico_nemotron_raciocinio.py
      - name: Consultar catalogo publico sem gastar tokens
        run: python diagnostico_nemotron_raciocinio.py
