name: ViralRadar - Teste Gemma gratuito com YouTube real
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxe sem chamadas externas
        run: python -m py_compile viral_dna_gemma_real_teste.py viral_dna_4_ideias_youtube_real.py viral_dna_adaptadores_isolados.py
      - name: Testar uma ideia real com Gemma gratuito
        run: python viral_dna_gemma_real_teste.py
