name: ViralRadar - Diagnostico Isolamento Rede V29
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: opencut-app/opencut-classic
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Identificar versao e licenca
        run: |
          git rev-parse HEAD
          head -25 LICENSE
          cat package.json
          cat apps/web/package.json
      - name: Instalar dependencias
        run: bun install --frozen-lockfile
      - name: Configurar ambiente local descartavel
        run: |
          cp apps/web/.env.example apps/web/.env.local
          docker compose up -d db redis serverless-redis-http
      - name: Instalar navegador de teste
        run: |
          npm install --prefix /tmp/vr-browser playwright
          /tmp/vr-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Instalar FFmpeg para gerar midias sinteticas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Iniciar editor e verificar HTTP
        run: |
          mkdir -p diagnostico /tmp/vr-media
          ffmpeg -v error -f lavfi -i color=c=blue:s=640x360 -frames:v 1 -threads 1 /tmp/vr-media/vr-imagem.png
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=25 -t 3 -c:v libx264 -pix_fmt yuv420p /tmp/vr-media/vr-video.mp4
          ffmpeg -v error -f lavfi -i sine=frequency=440:sample_rate=48000 -t 3 /tmp/vr-media/vr-audio.wav
          echo "NEXT VERSOES ANTES"
          node -e "console.log('root',require('./node_modules/next/package.json').version,'web',require('./apps/web/node_modules/next/package.json').version)"
          echo "ALINHANDO NEXT.JS SOMENTE NESTE RUNNER DESCARTAVEL"
          bun add next@16.1.3 --exact
          echo "NEXT VERSOES DEPOIS"
          node -e "console.log('root',require('./node_modules/next/package.json').version,'web',require('./apps/web/node_modules/next/package.json').version)"
          echo "CORRIGINDO VALIDACAO DE ATALHOS SOMENTE NO RUNNER"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/actions/keybinding.ts')
          s=p.read_text()
          anchor='export type KeybindingConfig = {'
          assert anchor in s
          patch='''export function isShortcutKey(value: string): value is ShortcutKey {
            const pieces = value.split("+");
            if (pieces.length === 1) return isKey(pieces[0]);
            const modifiers = pieces.slice(0, -1);
            if (!isKey(pieces[pieces.length - 1])) return false;
            if (new Set(modifiers).size !== modifiers.length) return false;
            const valid = ["ctrl", "alt", "shift"];
            if (modifiers.some(m => !valid.includes(m))) return false;
            if (modifiers.includes("shift") && !modifiers.includes("ctrl") && !modifiers.includes("alt")) return false;
            return modifiers.join("+") === ["ctrl","alt","shift"].filter(m => modifiers.includes(m)).join("+") ||
              modifiers.join("+") === ["alt","shift"].filter(m => modifiers.includes(m)).join("+");
          }

          '''
          p.write_text(s.replace(anchor,patch+anchor,1))
          print('VALIDADOR DE SHORTCUT ADICIONADO')
          PY
          echo "CORRIGINDO VALIDADOR DE ACOES NO RUNNER DESCARTAVEL"
          cat >> apps/web/src/actions/definitions.ts <<'TS'
          
          // Temporary production-build diagnostic: excludes actions that require arguments.
          export function isActionWithOptionalArgs(value: string): value is TActionWithOptionalArgs {
            return Object.prototype.hasOwnProperty.call(ACTIONS, value)
              && value !== "remove-media-asset"
              && value !== "remove-media-assets";
          }
          TS
          echo "DIAGNOSTICO GLOBAL TYPESCRIPT (NAO INTERROMPE TESTE)"
          (cd apps/web && ../../node_modules/.bin/tsc -p tsconfig.json --noEmit --pretty false) > diagnostico/tsc-completo.log 2>&1 || true
          echo "TOTAL DE ERROS TYPESCRIPT: $(grep -c 'error TS' diagnostico/tsc-completo.log || true)"
          grep 'error TS' diagnostico/tsc-completo.log | head -70 || true
          echo "CONFIGURANDO BYPASS TYPESCRIPT TEMPORARIO SOMENTE PARA DIAGNOSTICO"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/next.config.ts')
          s=p.read_text()
          needle='const nextConfig: NextConfig = {'
          assert needle in s
          p.write_text(s.replace(needle,needle+"\n\ttypescript: { ignoreBuildErrors: true },",1))
          print("AVISO: VERIFICACAO TYPESCRIPT DESATIVADA APENAS NA COPIA EFEMERA PARA INVESTIGAR RUNTIME")
          PY
          echo "BUILD PRODUCAO INICIO"
          (cd apps/web && bun run build) > diagnostico/build.log 2>&1 || { tail -100 diagnostico/build.log; exit 1; }
          echo "BUILD PRODUCAO OK"
          (cd apps/web && bun run start) > diagnostico/editor.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsSL --max-time 10 http://localhost:3000/ -o diagnostico/home.html; then
              echo "EDITOR HTTP OK"
              break
            fi
            sleep 5
          done
          test -s diagnostico/home.html
          curl -sS -D diagnostico/headers.txt -o /dev/null http://localhost:3000/projects
          cat diagnostico/headers.txt
          mkdir -p /tmp/vr-portal
          cat > /tmp/vr-portal/portal.py <<'PY'
          import base64, hmac, http.server, os, secrets, time, urllib.parse
          from http.cookies import SimpleCookie
          from urllib.request import Request, urlopen
          COOKIE_NAME = 'vr_editor_session'
          SESSION_TOKEN = secrets.token_urlsafe(32)
          TARGET = 'http://127.0.0.1:3000'
          PORT = 8765
          PORTAL = '''<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>ViralRadar - prototipo</title>
          <body style="background:#101827;color:white;font:18px system-ui;padding:40px">
          <h1>ViralRadar</h1><p>Ambiente de teste - assinante simulado</p><h2>Editor de vídeos</h2>
          <p>Crie, edite e exporte seus projetos.</p><a style="color:#80dfff" href="/launch">Abrir editor de vídeos</a>
          </body></html>'''
          class Handler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): print('PORTAL', fmt % args,flush=True)
              def is_authorized(self):
                  c=SimpleCookie()
                  try: c.load(self.headers.get('Cookie',''))
                  except Exception: return False
                  v=c.get(COOKIE_NAME)
                  return v is not None and hmac.compare_digest(v.value,SESSION_TOKEN)
              def respond(self,code,body=b'',kind='text/plain; charset=utf-8',headers=None):
                  self.send_response(code)
                  self.send_header('Content-Type',kind)
                  self.send_header('Cache-Control','no-store')
                  for k,v in (headers or []):self.send_header(k,v)
                  self.end_headers()
                  if self.command!='HEAD':self.wfile.write(body)
              def do_GET(self):
                  parsed=urllib.parse.urlsplit(self.path)
                  path=parsed.path
                  if path=='/':
                      return self.respond(200,PORTAL.encode(),'text/html; charset=utf-8')
                  if path=='/launch':
                      return self.respond(302,headers=[('Set-Cookie',f'{COOKIE_NAME}={SESSION_TOKEN}; HttpOnly; SameSite=Lax; Path=/'),('Location','/projects')])
                  if path in ('/projects','/editor') or path.startswith(('/projects/','/editor/','/_next/','/api/')):
                      if not self.is_authorized():
                          print('PORTAL BLOQUEIO SEM SESSAO',path,flush=True)
                          return self.respond(403,b'Access denied')
                      try:
                          req=Request(TARGET+self.path,headers={'Accept':self.headers.get('Accept','*/*'),'User-Agent':self.headers.get('User-Agent','ViralRadar-test')})
                          with urlopen(req,timeout=30) as upstream:
                              data=upstream.read()
                              headers=[]
                              for key,val in upstream.headers.items():
                                  if key.lower() not in ('content-length','content-encoding','transfer-encoding','connection','set-cookie','location'):
                                      headers.append((key,val))
                              return self.respond(upstream.status,data,upstream.headers.get('Content-Type','application/octet-stream'),headers)
                      except Exception as e:
                          print('PORTAL ERRO PROXY',str(e),flush=True)
                          return self.respond(502,str(e).encode())
                  return self.respond(404,b'Not found')
          class Server(http.server.ThreadingHTTPServer):allow_reuse_address=True
          Server(('127.0.0.1',PORT),Handler).serve_forever()
          PY
          python3 /tmp/vr-portal/portal.py > diagnostico/portal.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          echo "CONFIRMANDO PORTAO DE ACESSO"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/projects)
          echo "SEM LOGIN PORTAL HTTP $status"
          test "$status" = 403
          echo "DIAGNOSTICO DE EXPOSICAO DE PORTAS (SEM ALTERAR FIREWALL)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/proc/net/tcp')
          print('SOCKETS TCP EM ESCUTA (INET):')
          for line in p.read_text().splitlines()[1:]:
              x=line.split()
              if x[3]!='0A':continue
              addr,port=x[1].split(':')
              n=int(port,16)
              if n not in (3000,8765): continue
              ip='.'.join(str(int(addr[i:i+2],16)) for i in (6,4,2,0))
              print(f'PORTA {n} ENDERECO {ip} STATUS LISTEN')
          PY
          echo "TESTE ROTA DIRETA INTERNA E ROTA COM BLOQUEIO"
          direto=$(curl --max-time 10 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/projects)
          anonimo=$(curl --max-time 10 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/projects)
          echo "PORTA INTERNA RESPOSTA $direto"
          echo "PORTA PORTAL SEM SESSAO RESPOSTA $anonimo"
          test "$direto" = 200
          test "$anonimo" = 403
          echo "ALERTA DE ARQUITETURA: TESTE LOCAL NAO PROVA ISOLAMENTO EXTERNO"
          cat > /tmp/vr-browser/test.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--enable-unsafe-swiftshader']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            try {
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.screenshot({path:'diagnostico/portal-viralradar.png'});
              const blocked=await browser.newContext();
              try {
                const unsigned=await blocked.newPage();
                const res=await unsigned.goto('http://127.0.0.1:8765/projects',{waitUntil:'domcontentloaded'});
                if(res.status()!==403)throw new Error('PORTAL NAO BLOQUEOU VISITANTE: '+res.status());
                console.log('PORTAL BLOQUEOU VISITANTE SEM LOGIN',res.status());
              } finally {await blocked.close();}
              await page.getByRole('link',{name:'Abrir editor de vídeos'}).click();
              await page.waitForURL('http://127.0.0.1:8765/projects',{timeout:90000});
              const cookies=await page.context().cookies('http://127.0.0.1:8765');
              if(!cookies.some(x=>x.name==='vr_editor_session'))throw new Error('SESSAO SIMULADA NAO GRAVADA');
              console.log('PORTAL INICIOU SESSAO TEMPORARIA E REDIRECIONOU');
              const outro=await browser.newContext();
              try {
                const p2=await outro.newPage();
                await p2.goto('http://localhost:3000/projects',{waitUntil:'domcontentloaded'});
                await p2.getByRole('button',{name:/^New project$|^New$/i}).first().waitFor({timeout:90000});
                console.log('ALERTA: PORTA 3000 AINDA PERMITE ACESSO DIRETO - RESTRICAO DE REDE OBRIGATORIA');
              } finally {await outro.close();}
              const editorPage=await browser.newPage();
              await editorPage.goto('http://localhost:3000/projects',{waitUntil:'domcontentloaded'});
              await editorPage.getByRole('button',{name:/^New project$|^New$/i}).first().waitFor({timeout:90000});
              console.log('EDITOR INTERNO CONTINUA OPERACIONAL');
              await page.goto('http://localhost:3000/projects',{waitUntil:'domcontentloaded'});

              const create=page.getByRole('button',{name:/^New project$|^New$/i}).first();
              await create.waitFor({timeout:90000});
              await page.screenshot({path:'diagnostico/projetos.png'});
              await create.click({timeout:30000});
              // Diagnosticar navegacao quando o projeto nao abre de primeira.
              try {
                await page.waitForURL(/\/editor\/[^/]+/,{waitUntil:'domcontentloaded',timeout:45000});
              } catch(e) {
                console.log('FALHA PRIMEIRA NAVEGACAO',page.url());
                console.log('CORPO PROJETOS',(await page.locator('body').innerText()).slice(0,5500));
                await page.screenshot({path:'diagnostico/projeto-nao-abriu.png'});
                const projButtons=await page.getByRole('button').allTextContents();
                console.log('BOTOES PROJETOS',JSON.stringify(projButtons).slice(0,3500));
                const newAgain=page.getByRole('button',{name:/^New project$|^New$/i}).first();
                if(await newAgain.count() && await newAgain.isVisible()) {
                  await newAgain.click({timeout:15000});
                  await page.waitForURL(/\/editor\/[^/]+/,{waitUntil:'domcontentloaded',timeout:45000});
                  console.log('PROJETO ABERTO NA SEGUNDA TENTATIVA');
                } else {
                  throw e;
                }
              }
              // O modal em Radix oferece botoes Next, Next e Finish.
              // O teste V5 filtrou o dialog incorretamente. Usar os botoes visiveis.
              await page.screenshot({path:'diagnostico/entrada-editor.png'});
              const nextButton=page.getByRole('button',{name:'Next',exact:true});
              const finishButton=page.getByRole('button',{name:'Finish',exact:true});
              await page.waitForTimeout(800);
              if(await nextButton.isVisible()){
                await nextButton.click({timeout:15000});
                await nextButton.click({timeout:15000});
                await finishButton.click({timeout:15000});
                console.log('ONBOARDING CONCLUIDO');
              } else if(await page.getByRole('button',{name:/export/i}).first().isVisible()){
                console.log('EDITOR SEM ONBOARDING');
              } else {
                await page.screenshot({path:'diagnostico/modal-nao-identificado.png'});
                throw new Error('Nem Next nem Export visivel. Revisar captura');
              }
              await page.screenshot({path:'diagnostico/apos-introducao.png'});
              console.log('URL EDITOR',page.url());
              console.log('TEXTO EDITOR',(await page.locator('body').innerText()).slice(0,4500));
              console.log('BOTOES EDITOR',JSON.stringify(await page.getByRole('button').allTextContents()).slice(0,3500));
              await page.screenshot({path:'diagnostico/apos-introducao.png'});
              await page.getByRole('button',{name:/export/i}).first().waitFor({timeout:30000});
              await page.screenshot({path:'diagnostico/editor.png'});
              console.log('PROJETO CRIADO E EDITOR ABERTO',page.url());
              console.log((await page.locator('body').innerText()).slice(0,4000));
              const media=['vr-imagem.png','vr-video.mp4','vr-audio.wav'];
              for(const name of media){
                const chooser=page.waitForEvent('filechooser',{timeout:15000});
                await page.getByRole('button',{name:'Import',exact:true}).click();
                await (await chooser).setFiles('/tmp/vr-media/'+name);
                await page.getByText(name,{exact:false}).first().waitFor({timeout:30000});
                console.log('MIDIA IMPORTADA',name);
              }
              await page.screenshot({path:'diagnostico/midias.png'});
              // O botao '+' da thumbnail nao possui atributo title.
              const imageCard=page.locator('[title="vr-imagem.png"]').first().locator('xpath=ancestor::div[contains(@class,"group")][1]');
              await imageCard.hover();
              console.log('BOTOES IMAGEM',await imageCard.locator('button').count());
              await imageCard.locator('button').first().click({timeout:15000});
              await page.waitForTimeout(800);
              console.log('TIMELINE TEXTO',(await page.locator('body').innerText()).slice(-3500));
              console.log('IMAGEM ADICIONADA TIMELINE');
              await page.screenshot({path:'diagnostico/timeline.png'});
              // Adicionar tambem o clipe de video e o audio de teste.
              for(const name of ['vr-video.mp4','vr-audio.wav']){
                const card=page.locator('[title="'+name+'"]').first().locator('xpath=ancestor::div[contains(@class,"group")][1]');
                await card.hover();
                await card.locator('button').first().click({timeout:15000});
                console.log('ELEMENTO ADICIONADO TIMELINE',name);
              }
              await page.waitForTimeout(1200);
              await page.screenshot({path:'diagnostico/timeline-video-audio.png'});
              // Exigir que os tres nomes aparecam em ao menos dois locais: Asset e Timeline.
              for(const name of media){
                const count=await page.getByText(name,{exact:true}).count();
                console.log('OCORRENCIAS NA INTERFACE',name,count);
                if(count<2)throw new Error('Midia nao identificada na timeline: '+name);
              }
              // Diagnostico dos controles nativos de texto e legendas.
              const controls=()=>page.locator('button,[role="tab"],[role="button"]').evaluateAll(els=>els.map(e=>({text:e.textContent.trim(),title:e.getAttribute('title'),aria:e.getAttribute('aria-label'),'data-state':e.getAttribute('data-state')})));
              console.log('CONTROLES ANTES',JSON.stringify(await controls()));
              const tab=page.locator('button,[role="tab"],[role="button"]').filter({hasText:/^Text$/i}).first();
              const fallback=page.locator('[title="Text"],[aria-label="Text"]').first();
              if(await tab.isVisible()) await tab.click();
              else if(await fallback.isVisible()) await fallback.click();
              else throw new Error('Controle Text nao localizado; consultar CONTROLES ANTES');
              await page.waitForTimeout(1000);
              console.log('PAINEL TEXTO',await page.locator('body').innerText());
              console.log('CONTROLES TEXTO',JSON.stringify(await controls()));
              await page.screenshot({path:'diagnostico/painel-texto.png'});
              const target=page.getByText('Default text',{exact:true}).first();
              await target.waitFor({state:'visible',timeout:15000});
              console.log('TARGET',await target.evaluate(e=>({outer:e.outerHTML,parents:[e.parentElement,e.parentElement?.parentElement,e.parentElement?.parentElement?.parentElement].filter(Boolean).map(p=>p.outerHTML.slice(0,4000))})));
              await target.hover();
              await page.waitForTimeout(700);
              console.log('HOVER CONTROLS',JSON.stringify(await page.locator('button,[role="button"],[title],[aria-label]').evaluateAll(es=>es.filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0}).map(e=>({tag:e.tagName,text:(e.textContent||'').trim().slice(0,100),title:e.getAttribute('title'),aria:e.getAttribute('aria-label'),html:e.outerHTML.slice(0,500)})).filter(x=>x.text.includes('Default')||x.title||x.aria).slice(0,65))));
              await page.screenshot({path:'diagnostico/hover-card-texto.png'});
              const card=target.locator('xpath=ancestor::div[contains(@class,"group")][1]');
              console.log('CARD EXISTE',await card.count());
              if(await card.count()){
                console.log('CARD HTML',await card.evaluate(e=>e.outerHTML.slice(0,6500)));
                console.log('CARD BUTTONS',JSON.stringify(await card.locator('button').evaluateAll(es=>es.map(e=>({html:e.outerHTML.slice(0,700),text:e.textContent})))));
                const button=card.locator('button').first();
                if(await button.count()){
                  await button.click({timeout:15000});
                  console.log('CLICOU BOTAO DO CARD');
                }else{
                  await card.click({timeout:15000});
                  console.log('CLICOU CARD');
                }
              }else{
                await target.dblclick({timeout:15000});
                console.log('DOUBLE CLICK TARGET');
              }
              await page.waitForTimeout(1300);
              console.log('DEPOIS INTERACAO',(await page.locator('body').innerText()).slice(-5500));
              console.log('TEXT COUNT',await page.getByText('Default text',{exact:true}).count());
              console.log('INPUTS',JSON.stringify(await page.locator('input,textarea,[contenteditable="true"]').evaluateAll(es=>es.map(e=>({tag:e.tagName,placeholder:e.getAttribute('placeholder'),value:e.value||e.textContent})))));
              await page.screenshot({path:'diagnostico/apos-insercao-texto.png'});
              // Editar conteudo na interface com valor unico.
              const novoTexto='VIRALRADAR V29';
              const editorTexto=page.locator('textarea').first();
              await editorTexto.waitFor({state:'visible',timeout:15000});
              await editorTexto.fill(novoTexto);
              await editorTexto.press('Tab');
              await page.waitForTimeout(1000);
              // Testar ajuste de tamanho na interface antes de exportar.
              const sizeInput=page.locator('input').evaluateAll(els=>els.filter(e=>e.value==='15').map(e=>e.outerHTML));
              console.log('INPUT FONTE ANTES',JSON.stringify(await sizeInput));
              const sizeField=page.locator('input[inputmode="decimal"]').filter({visible:true}).first();
              await sizeField.waitFor({state:'visible',timeout:15000});
              await sizeField.fill('8');
              console.log('FONTE APOS FILL',await sizeField.inputValue());
              await page.keyboard.press('Tab');
              await page.waitForTimeout(700);
              console.log('TAMANHO DE FONTE APOS',await sizeField.inputValue());
              if((await sizeField.inputValue())!=='8')throw new Error('Tamanho nao foi atualizado para 8');
              await page.screenshot({path:'diagnostico/v29-texto-8.png'});
              console.log('TEXTO EDITADO VALOR',await editorTexto.inputValue());
              if(await editorTexto.inputValue()!==novoTexto)throw new Error('Texto nao permaneceu no editor');
              console.log('OCORRENCIAS NOVO TEXTO',await page.getByText(novoTexto,{exact:true}).count());
              console.log('PROPRIEDADES ATUALIZADAS',JSON.stringify(await page.locator('input,textarea').evaluateAll(es=>es.map(e=>({tag:e.tagName,value:e.value})))));
              await page.screenshot({path:'diagnostico/texto-personalizado-v16.png'});
              console.log('TEXTO PERSONALIZADO NA INTERFACE CONFIRMADO');
              const resultados=[];
              async function testar(nome,fn){
                try {const detalhe=await fn();resultados.push({nome,status:'OK',detalhe});}
                catch(e){resultados.push({nome,status:'PENDENTE',detalhe:String(e.message).slice(0,600)});}
                console.log('RESULTADO CONSOLIDADO',JSON.stringify(resultados.at(-1)));
              }
              const inventario=()=>page.locator('button,input,select,[role="combobox"],[role="tab"],[role="menuitem"]').evaluateAll(es=>es.filter(e=>e.getBoundingClientRect().width&&e.getBoundingClientRect().height).map(e=>({tag:e.tagName,text:(e.innerText||'').trim().slice(0,120),aria:e.getAttribute('aria-label'),title:e.getAttribute('title'),value:e.value,role:e.getAttribute('role')})));
              await testar('Cor do texto',async()=>{
                const campo=page.locator('input[value="FFFFFF"]').first();
                await campo.fill('FFFF00',{timeout:5000});
                await page.keyboard.press('Tab');
                await page.waitForTimeout(500);
                if(!await page.locator('input[value="FFFF00"]').count())throw Error('Cor nao confirmada');
                return 'FFFF00';
              });
              await testar('Opcoes de fonte',async()=>{
                const campo=page.locator('input[value="Arial"]').first();
                await campo.click({timeout:5000});
                await page.waitForTimeout(400);
                const dados=await inventario();
                console.log('FONTES INVENTARIO',JSON.stringify(dados));
                await page.screenshot({path:'diagnostico/fontes.png'});
                await page.keyboard.press('Escape');
                return 'Menu inspecionado; selecao alternativa ainda nao validada';
              });
              console.log('FORMATACAO POSICAO INVENTARIO',JSON.stringify(await inventario()));
              await page.screenshot({path:'diagnostico/formatacao-posicao.png'});
              await testar('Painel de legendas',async()=>{
                await page.locator('[aria-label="Captions"],[title="Captions"]').first().click({timeout:5000});
                await page.waitForTimeout(700);
                console.log('LEGENDAS CORPO',(await page.locator('body').innerText()).slice(0,7000));
                console.log('LEGENDAS CONTROLES',JSON.stringify(await inventario()));
                await page.screenshot({path:'diagnostico/legendas.png'});
                return 'Painel aberto; geracao de legendas ainda nao validada';
              });
              await testar('Painel de transicoes',async()=>{
                await page.locator('[aria-label="Transitions"],[title="Transitions"]').first().click({timeout:5000});
                await page.waitForTimeout(500);
                console.log('TRANSICOES CONTROLES',JSON.stringify(await inventario()));
                await page.screenshot({path:'diagnostico/transicoes.png'});
                return 'Painel aberto; aplicacao ainda nao validada';
              });
              console.log('FORMATO VIDEO INVENTARIO',JSON.stringify(await inventario()));
              fs.writeFileSync('diagnostico/resultados-consolidados.json',JSON.stringify(resultados,null,2));
              // Exportar e guardar arquivo para validacao visual posterior.
              // Exportar MP4 via o proprio navegador.
              const downloadPromise=page.waitForEvent('download',{timeout:180000});
              await page.getByRole('button',{name:'Export',exact:true}).first().click();
              await page.getByRole('heading',{name:'Export project'}).waitFor({timeout:15000});
              console.log('EXPORT CONFIG',JSON.stringify(await inventario()));
              await page.screenshot({path:'diagnostico/config-exportacao.png'});
              await page.getByRole('button',{name:'Export',exact:true}).last().click();
              const download=await downloadPromise;
              await download.saveAs('diagnostico/arquivo-exportado.mp4');
              const size=fs.statSync('diagnostico/arquivo-exportado.mp4').size;
              console.log('MP4 EXPORTADO',download.suggestedFilename(),size);
              if(size<1000)throw new Error('MP4 vazio ou muito pequeno');
              await page.reload({waitUntil:'domcontentloaded'});
              const dialogs=page.getByRole('dialog');
              if(await dialogs.count() && await dialogs.first().isVisible()) await page.keyboard.press('Escape');
              await page.screenshot({path:'diagnostico/reaberto.png'});
              await page.getByRole('button',{name:/export/i}).first().waitFor({timeout:30000});
              for(const name of media){
                await page.getByText(name,{exact:false}).first().waitFor({timeout:30000});
                console.log('MIDIA RECUPERADA',name);
              }
              console.log('PROJETO REABERTO COM MIDIAS');
              console.log('TEXTO APOS REABERTURA',await page.getByText('VIRALRADAR V29',{exact:true}).count());
              await page.screenshot({path:'diagnostico/texto-apos-reabertura-v16.png'});
              await page.screenshot({path:'diagnostico/timeline-recuperada.png'});
            } finally {
              fs.writeFileSync('diagnostico/erros.json',JSON.stringify(errors,null,2));
              await page.screenshot({path:'diagnostico/final.png'}).catch(()=>{});
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node /tmp/vr-browser/test.cjs
          ffmpeg -v error -y -ss 1 -i diagnostico/arquivo-exportado.mp4 -frames:v 1 diagnostico/v29-quadro-1s.png
          ffmpeg -v error -y -ss 2 -i diagnostico/arquivo-exportado.mp4 -frames:v 1 diagnostico/v29-quadro-2s.png
          ffmpeg -v error -y -ss 3 -i diagnostico/arquivo-exportado.mp4 -frames:v 1 diagnostico/v29-quadro-3s.png
          python3 - <<'PY'
          import os
          for filename in ['v29-quadro-1s.png','v29-quadro-2s.png','v29-quadro-3s.png']:
              path='diagnostico/'+filename
              print('QUADRO EXPORTADO',filename,os.path.getsize(path))
          PY
          ffprobe -v error -show_entries stream=codec_type,codec_name:format=duration,size -of default=noprint_wrappers=1 diagnostico/arquivo-exportado.mp4
          test "$(ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 diagnostico/arquivo-exportado.mp4 | head -1)" = "audio"
          echo "MP4 COM AUDIO CONFIRMADO"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viralradar-editor-rede-v29
          path: diagnostico/
          retention-days: 3
