name: Cloudflare AI - roteiro estruturado final
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cidb67/viralradar
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests streamlit
      - name: Validar tres blocos com estrutura real
        run: |
          python - <<'PY'
          import os, requests, time, re
          import viralradar_ia as ia
          import estudio_roteiros_independente as studio
          account,token=os.environ['CF_ACCOUNT'],os.environ['CF_TOKEN']
          assert account and token
          model='@cf/openai/gpt-oss-120b'
          total=0
          calls=0
          def gerar(prompt, validar, *args, **kwargs):
              global total,calls
              extra = ('\nREGRA FINAL DE EXTENSAO: produza aproximadamente 700 palavras narradas neste bloco, '
                       'entre 560 e 840. Planeje sete paragrafos narrativos de cerca de 100 palavras no total dos campos falados. '
                       'O desenvolvimento deve conter a maior parte das palavras, em uma unica string JSON, nunca lista. '
                       'Reserve palavras para gancho, encerramento e chamada somente quando aplicaveis. '
                       'Mantenha exatamente os seis campos de texto e N/A conforme as regras anteriores. '
                       'Nao inclua contagem de palavras ou notas de cena na narracao.')
              for attempt in range(2):
                  calls+=1
                  start=time.monotonic()
                  r=requests.post(f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1/chat/completions',headers={'Authorization':'Bearer '+token},json={'model':model,'messages':[{'role':'user','content':prompt+extra}],'max_tokens':4000,'reasoning_effort':'low'},timeout=100)
                  print('CHAMADA',calls,'HTTP',r.status_code,'segundos',round(time.monotonic()-start,2),flush=True)
                  if not r.ok: raise ValueError('HTTP '+str(r.status_code))
                  d=r.json()
                  usage=d.get('usage',{})
                  total+=float(usage.get('neurons',0))
                  print('usage:',usage,flush=True)
                  c=d['choices'][0]
                  raw=c['message'].get('content')
                  if c.get('finish_reason')!='stop' or not isinstance(raw,str): raise ValueError('Resposta incompleta')
                  raw=re.sub(r'<think>.*?</think>','',raw,flags=re.S).strip()
                  try:
                      parsed=studio.validar_roteiro(raw)
                      n=sum(len(parsed[k].split()) for k in ('gancho','desenvolvimento','encerramento','chamada_acao') if parsed[k]!='N/A')
                      print('PALAVRAS DO BLOCO:',n,flush=True)
                      result=validar(raw)
                      print('VALIDADOR REAL: APROVADO',flush=True)
                      return result,model
                  except ValueError as e:
                      print('REJEITADO:',str(e),flush=True)
                      if attempt==1: raise
                      extra+='\nA tentativa anterior foi rejeitada. Corrija a estrutura e mantenha a extensao entre 560 e 840 palavras.'
          ia.gerar_validado=gerar
          try:
              prompt=studio.criar_prompt_ideia('Como os oceanos regulam o clima','YouTube','Vídeo longo','Publico geral','Educativo')
              roteiro=studio.gerar_roteiro_com_duracao(prompt,900,140,'','')
              n=sum(len(roteiro[k].split()) for k in ('gancho','desenvolvimento','encerramento','chamada_acao'))
              print('ROTEIRO COMPLETO:',n,'palavras; minutos:',round(n/140,2),flush=True)
              assert 1680<=n<=2520
              print('APROVADO',flush=True)
          finally:
              print('TOTAL NEURONS:',round(total,2),'CHAMADAS:',calls,flush=True)
          PY
