name: Cloudflare AI - validadores reais
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cidb67/viralradar
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests streamlit
      - name: Validar modulos reais sem alterar producao
        run: |
          python - <<'PY'
          import os, requests, time, re
          import viralradar_ia as ia
          import viral_dna_inteligencia as dna
          import viral_dna_ideias as ideias
          import viral_dna_traducao as trad
          import estudio_roteiros_independente as studio
          account,token=os.environ['CF_ACCOUNT'],os.environ['CF_TOKEN']
          assert account and token
          model='@cf/openai/gpt-oss-120b'
          total=0
          def gerar(prompt, validar, *args, **kwargs):
              global total
              start=time.monotonic()
              r=requests.post(f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1/chat/completions',headers={'Authorization':'Bearer '+token},json={'model':model,'messages':[{'role':'user','content':prompt}],'max_tokens':6000,'reasoning_effort':'low'},timeout=120)
              print('HTTP',r.status_code,'segundos',round(time.monotonic()-start,2),flush=True)
              if not r.ok: raise ValueError('HTTP '+str(r.status_code))
              d=r.json()
              usage=d.get('usage',{})
              total+=float(usage.get('neurons',0))
              print('usage:',usage,flush=True)
              c=d['choices'][0]
              raw=c['message'].get('content')
              if c.get('finish_reason')!='stop' or not isinstance(raw,str): raise ValueError('Resposta incompleta ou nao textual')
              raw=re.sub(r'<think>.*?</think>','',raw,flags=re.S).strip()
              result=validar(raw)
              print('VALIDADOR REAL: APROVADO',flush=True)
              return result,model
          ia.gerar_validado=gerar
          titles=['How oceans move heat','Why currents matter','The deep ocean','Ocean carbon cycle','Life under ice','Waves and weather','Coral reefs','Ocean salinity','The Gulf Stream','Marine ecosystems','Coastal winds','Ocean temperatures','Polar seas','Tides and climate','Ocean observation']
          videos=[dict(id=f'test{i:07d}',titulo=t,idade_dias=i+1,visualizacoes=1000+i*731,curtidas=50+i,comentarios=10+i,duracao_iso8601='PT10M') for i,t in enumerate(titles)]
          coleta={'canal':{'nome':'Canal ficticio de ciencia'},'videos':videos}
          ev=dna.preparar_evidencias(coleta)
          diag=None
          results={}
          def test(name,fn):
              print('TESTE:',name,flush=True)
              try:
                  value=fn()
                  results[name]=True
                  print('APROVADO:',name,flush=True)
                  return value
              except Exception as e:
                  results[name]=False
                  print('FALHA:',name,type(e).__name__,str(e)[:200],flush=True)
          test('traducao 15 titulos',lambda:trad.traduzir_titulos_dna(videos,''))
          diag=test('DNA',lambda:gerar(dna.montar_prompt_dna(ev),dna.validar_diagnostico)[0])
          if diag:
              test('quatro ideias',lambda:ideias.gerar_quatro_ideias(ev,diag,'','ciencia'))
          else:
              results['quatro ideias']=False
          prompt=studio.criar_prompt_ideia('Como os oceanos regulam o clima','YouTube','Vídeo longo','Publico geral','Educativo')
          roteiro=test('roteiro 15 minutos',lambda:studio.gerar_roteiro_com_duracao(prompt,900,140,'',''))
          if roteiro:
              print('PALAVRAS:',sum(len(roteiro[k].split()) for k in ('gancho','desenvolvimento','encerramento','chamada_acao')),flush=True)
          print('RESULTADOS:',results,'NEURONS:',round(total,2),flush=True)
          if not all(results.values()): raise SystemExit(1)
          PY
