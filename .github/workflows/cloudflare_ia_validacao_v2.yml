name: Cloudflare AI - validacao segunda rodada
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Comparar modelos e validar conteudo
        run: |
          python - <<'PY'
          import os, requests, json, time, re
          account, token = os.environ['CF_ACCOUNT'], os.environ['CF_TOKEN']
          assert account and token
          models = ['@cf/meta/llama-3.3-70b-instruct-fp8-fast','@cf/openai/gpt-oss-120b','@cf/meta/llama-4-scout-17b-16e-instruct']
          sample = [{'titulo':f'Oceano: fenomeno {i}', 'views': 1000+i*731,'duracao_min': 8+i%5} for i in range(1,16)]
          keys = ['nicho','publico','temas','gatilhos','titulos','narrativa','visual','limitacoes']
          tests = [
            ('roteiro', 'Escreva uma narracao documental em portugues sobre oceanos e clima. Produza exatamente 7 paragrafos de aproximadamente 100 palavras cada. Total 700 palavras. Sem titulos ou cenas. Retorne apenas JSON com chave roteiro.', 2500),
            ('dna', 'Analise esta amostra ficticia sem inventar dados: '+json.dumps(sample)+' . Retorne JSON com oito campos preenchidos: '+', '.join(keys)+'. Indique limitacoes dos dados.', 1800),
            ('ideias', 'Proponha quatro videos documentais distintos sobre oceanos. Retorne JSON com chave ideias, lista de quatro objetos, cada um com titulo, gancho, resumo e thumbnail, todos textos preenchidos.', 2200)
          ]
          total = 0
          for model in models:
              for name,prompt,limit in tests:
                  if total >= 4000:
                      print('Limite preventivo local atingido; encerrando.')
                      break
                  start=time.monotonic()
                  try:
                      payload={'model':model,'messages':[{'role':'user','content':prompt}],'max_tokens':limit}
                      if 'gpt-oss' in model:
                          payload['reasoning_effort']='low'
                      r=requests.post(f'https://api.cloudflare.com/client/v4/accounts/{account}/ai/v1/chat/completions',headers={'Authorization':'Bearer '+token},json=payload,timeout=90)
                      print(model,name,'HTTP',r.status_code,'segundos',round(time.monotonic()-start,2))
                      d=r.json()
                      if not r.ok:
                          print('ERRO API'); continue
                      usage=d.get('usage',{})
                      print('usage:',usage)
                      total+=float(usage.get('neurons') or (usage.get('total_tokens',limit)*0.3))
                      choice=d['choices'][0]
                      print('finish:',choice.get('finish_reason'))
                      raw=choice['message'].get('content') or ''
                      raw=re.sub(r'<think>.*?</think>','',raw,flags=re.S).strip()
                      raw=re.sub(r'^\x60\x60\x60(?:json)?\s*|\s*\x60\x60\x60$','',raw).strip()
                      obj=json.loads(raw)
                      if name=='roteiro':
                          n=len(obj['roteiro'].split())
                          print('palavras:',n,'PASSOU:',560<=n<=840)
                      elif name=='dna':
                          print('PASSOU:',all(obj.get(k) for k in keys))
                      else:
                          items=obj['ideias']
                          print('PASSOU:',len(items)==4 and all(all(isinstance(x.get(k),str) and x[k].strip() for k in ('titulo','gancho','resumo','thumbnail')) for x in items))
                  except Exception as e:
                      print('FALHA:',type(e).__name__)
          print('Consumo local contabilizado/estimado:',round(total,2))
          PY
