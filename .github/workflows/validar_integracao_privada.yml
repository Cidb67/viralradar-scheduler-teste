name: ViralRadar - Validacao segura da integracao

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: viralradar-validacao-integracao
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validar presenca de credenciais sem revelar valores
        env:
          PRIVATE_REPO_READ_TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os
          names = ('PRIVATE_REPO_READ_TOKEN', 'YOUTUBE_API_KEY',
                   'SUPABASE_HOST', 'SUPABASE_PORT', 'SUPABASE_DATABASE',
                   'SUPABASE_USER', 'SUPABASE_PASSWORD', 'TELEGRAM_BOT_TOKEN',
                   'INSTAGRAM_ACCESS_TOKEN', 'INSTAGRAM_BUSINESS_ACCOUNT_ID')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Credenciais ausentes: ' + ', '.join(missing))
          print('Todas as credenciais necessarias estao presentes.')
          PY

      - name: Obter somente os monitores do repositorio privado
        uses: actions/checkout@v4
        with:
          repository: Cidb67/viralradar
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          path: codigo-privado
          persist-credentials: false
          sparse-checkout: |
            instagram_monitor.py
            viralradar_monitor.py
          sparse-checkout-cone-mode: false

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencia de conexao
        run: python -m pip install psycopg2-binary

      - name: Verificar sintaxe sem executar monitores
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ('instagram_monitor.py', 'viralradar_monitor.py'):
              p = Path('codigo-privado') / name
              ast.parse(p.read_text(encoding='utf-8'), filename=name)
              print(name + ': sintaxe validada')
          PY

      - name: Testar conexao somente leitura ao Supabase
        env:
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT: ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DATABASE: ${{ secrets.SUPABASE_DATABASE }}
          SUPABASE_USER: ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import psycopg2
          conn = psycopg2.connect(
              host=os.environ['SUPABASE_HOST'],
              port=int(os.environ['SUPABASE_PORT']),
              dbname=os.environ['SUPABASE_DATABASE'],
              user=os.environ['SUPABASE_USER'],
              password=os.environ['SUPABASE_PASSWORD'],
              sslmode='require',
              connect_timeout=12,
          )
          try:
              conn.set_session(readonly=True, autocommit=True)
              with conn.cursor() as cur:
                  cur.execute('SELECT 1')
                  assert cur.fetchone()[0] == 1
              print('Conexao Supabase validada (somente leitura).')
          finally:
              conn.close()
          PY

      - name: Resumo
        run: |
          echo 'Validacao concluida sem executar monitores.'
          echo 'Nenhum alerta Telegram enviado e nenhuma tabela alterada.'
