name: Wikimedia - Compatibilidade de video
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Instalar FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Validar video e conversao MP4
        run: |
          python - <<'PY'
          import requests, subprocess, tempfile, pathlib, json
          s=requests.Session()
          s.headers['User-Agent']='ViralRadarMediaTest/1.0 (https://github.com/Cidb67/viralradar-scheduler-teste)'
          r=s.get('https://commons.wikimedia.org/w/api.php',params={'action':'query','titles':'File:Giza pyramid complex 3D flyover.webm','prop':'imageinfo','iiprop':'url|size|mime|extmetadata','format':'json','formatversion':2},timeout=30)
          r.raise_for_status()
          i=r.json()['query']['pages'][0]['imageinfo'][0]
          lic=i['extmetadata']['LicenseShortName']['value']
          print('LICENCA',lic, 'ORIGEM',i['descriptionurl'], 'BYTES',i['size'],flush=True)
          if lic not in ('CC0','Public domain'): raise RuntimeError('Licenca fora do teste')
          if i['size']>100*1024*1024: raise RuntimeError('Arquivo excede limite de teste')
          with tempfile.TemporaryDirectory() as d:
              src=pathlib.Path(d)/'original.webm'
              dst=pathlib.Path(d)/'teste.mp4'
              with s.get(i['url'],stream=True,timeout=60) as v:
                  v.raise_for_status()
                  n=0
                  with src.open('wb') as f:
                      for chunk in v.iter_content(65536):
                          n+=len(chunk)
                          if n>100*1024*1024: raise RuntimeError('Limite de download')
                          f.write(chunk)
              def probe(p):
                  return json.loads(subprocess.check_output(['ffprobe','-v','error','-show_entries','stream=codec_name,width,height:format=duration','-of','json',str(p)]))
              print('ORIGINAL',probe(src),flush=True)
              subprocess.run(['ffmpeg','-v','error','-y','-i',str(src),'-t','5','-map','0:v:0','-map','0:a:0?','-c:v','libx264','-pix_fmt','yuv420p','-c:a','aac','-movflags','+faststart',str(dst)],check=True,timeout=120)
              print('MP4',probe(dst),flush=True)
              subprocess.run(['ffmpeg','-v','error','-i',str(dst),'-f','null','-'],check=True,timeout=60)
              print('APROVADO: conversao e decodificacao de trecho MP4')
          PY
