name: Diagnostico IA - roteiro 10 minutos
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Cidb67/viralradar
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests streamlit
      - name: Diagnosticar cadeia real sem modificar arquivos
        run: |
          python - <<'PY'
          import os, time, logging, requests, streamlit as st
          from urllib.parse import urlparse
          import viralradar_ia as ia
          import estudio_roteiros_independente as studio
          logging.basicConfig(level=logging.INFO,format='%(levelname)s %(message)s')
          keys=('GEMINI_API_KEY','GROQ_API_KEY','GROQ_MODEL','OPENROUTER_API_KEY','CLOUDFLARE_ACCOUNT_ID','CLOUDFLARE_API_TOKEN')
          st.secrets={k:os.environ.get(k,'') for k in keys}
          for k in keys:
              print(k, 'CONFIGURADO' if st.secrets[k] else 'AUSENTE',flush=True)
          original=requests.sessions.Session.request
          def trace(self,method,url,*args,**kwargs):
              host=urlparse(url).hostname
              start=time.monotonic()
              try:
                  r=original(self,method,url,*args,**kwargs)
              except requests.RequestException as e:
                  print('REDE:',host,type(e).__name__,flush=True)
                  raise
              print('API:',host,'HTTP',r.status_code,'segundos',round(time.monotonic()-start,2),flush=True)
              try:
                  d=r.json()
                  u=d.get('usage') or d.get('usageMetadata') or {}
                  print('USO:',{k:u[k] for k in ('neurons','total_tokens','prompt_tokens','completion_tokens','totalTokenCount','cost') if k in u},flush=True)
                  if d.get('choices'):
                      print('FINISH:',d['choices'][0].get('finish_reason'),flush=True)
                  elif d.get('candidates'):
                      print('FINISH:',d['candidates'][0].get('finishReason'),flush=True)
              except (ValueError,TypeError,AttributeError,KeyError,IndexError):
                  pass
              return r
          requests.sessions.Session.request=trace
          real=ia.gerar_validado
          block=0
          approved=[]
          def traced(prompt,validar,*args,**kwargs):
              global block
              block+=1
              print('INICIO BLOCO',block,flush=True)
              def check(raw):
                  try:
                      data=studio.validar_roteiro(raw)
                      counts={k:0 if data[k]=='N/A' else len(data[k].split()) for k in ('gancho','desenvolvimento','encerramento','chamada_acao')}
                      print('PALAVRAS POR CAMPO:',counts,'TOTAL:',sum(counts.values()),flush=True)
                  except ValueError:
                      print('ESTRUTURA INVALIDA',flush=True)
                  try:
                      return validar(raw)
                  except ValueError as e:
                      print('REJEICAO:',str(e),flush=True)
                      raise
              result,model=real(prompt,check,*args,**kwargs)
              approved.append(block)
              print('BLOCO APROVADO:',block,'MODELO:',model,flush=True)
              return result,model
          ia.gerar_validado=traced
          try:
              prompt=studio.criar_prompt_ideia('Cinco hábitos dos empreendedores de sucesso','YouTube','Vídeo longo','Empreendedores','Educativo')
              roteiro=studio.gerar_roteiro_com_duracao(prompt,600,140,'','')
              n=sum(len(roteiro[k].split()) for k in ('gancho','desenvolvimento','encerramento','chamada_acao'))
              print('ROTEIRO APROVADO:',n,'palavras; minutos:',round(n/140,2),flush=True)
          except Exception as e:
              print('FALHA FINAL:',type(e).__name__,flush=True)
              if isinstance(e,ValueError): print('MOTIVO:',str(e),flush=True)
              raise SystemExit(1)
          finally:
              print('BLOCOS APROVADOS:',approved,flush=True)
          PY
