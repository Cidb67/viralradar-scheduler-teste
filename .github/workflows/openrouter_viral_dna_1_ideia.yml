name: Viral DNA - OpenRouter 1 ideia
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-uma-ideia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Testar uma ideia completa
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          chave = os.getenv("OPENROUTER_API_KEY","").strip()
          if not chave:
              sys.exit("Secret OPENROUTER_API_KEY ausente")
          campos = ("titulo","conceito","gancho","frase_thumbnail","visual_thumbnail",
                    "emocao_hipotese","estrategia_editorial","diferencial_original",
                    "cuidados_verificacao","gatilho_thumbnail","prompt_thumbnail")
          ids = ["teste_a","teste_b","teste_c","teste_d","teste_e"]
          prompt = (
              "TESTE com fontes inteiramente ficticias. Gere EXATAMENTE UMA ideia original "
              "de video em portugues brasileiro sobre uma curiosidade astronomica. "
              "Retorne SOMENTE JSON: objeto com chave ideias contendo lista de UM objeto. "
              "O objeto deve ter todos os campos de texto: " + ", ".join(campos) +
              "; mais fontes_ids, lista com 1 a 3 IDs dentre " + ", ".join(ids) + ". "
              "titulo e frase_thumbnail: 5 a 80 caracteres. Outros campos: 15 a 180 "
              "caracteres, exceto prompt_thumbnail: 160 a 420 caracteres. "
              "emocao_hipotese deve incluir literalmente HIPÓTESE. "
              "prompt_thumbnail descreve imagem 16:9, sem letras, texto, logos ou marcas, "
              "reservando espaco para frase adicionada depois. Nao invente metricas, "
              "nem afirme que as fontes sinteticas representam videos reais. "
              "Sem markdown nem texto fora do JSON."
          )
          payload = {"model":"openrouter/free","messages":[{"role":"user","content":prompt}],
                     "temperature":0.2,"max_tokens":3000}
          req = urllib.request.Request(
              "https://openrouter.ai/api/v1/chat/completions",
              data=json.dumps(payload,ensure_ascii=False).encode("utf-8"),
              headers={"Authorization":"Bearer "+chave,"Content-Type":"application/json",
                       "X-Title":"ViralRadar teste DNA uma ideia"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=75) as response:
                  data=json.load(response)
          except urllib.error.HTTPError as e:
              sys.exit("Falha API: HTTP "+str(e.code))
          except Exception as e:
              sys.exit("Falha de rede: "+type(e).__name__)
          modelo=data.get("model","nao informado")
          try:
              escolha=data["choices"][0]
              motivo=escolha.get("finish_reason")
              uso=data.get("usage") or {}
              print("Modelo:",modelo)
              print("Motivo de parada:",motivo)
              print("Tokens totais informados:",uso.get("total_tokens","nao informado"))
              print("Tokens de saida informados:",uso.get("completion_tokens","nao informado"))
              if motivo!="stop":
                  raise ValueError("resposta incompleta")
              bruto=escolha["message"]["content"]
              if not isinstance(bruto,str):
                  raise ValueError("conteudo ausente")
              bruto=bruto.strip()
              if bruto.startswith("```"):
                  bruto="\n".join(bruto.splitlines()[1:-1]).strip()
              dados=json.loads(bruto)
              if not isinstance(dados,dict) or set(dados)!={"ideias"}:
                  raise ValueError("estrutura raiz")
              ideias=dados["ideias"]
              if not isinstance(ideias,list) or len(ideias)!=1:
                  raise ValueError("quantidade de ideias")
              ideia=ideias[0]
              if not isinstance(ideia,dict) or set(ideia)!=set(campos)|{"fontes_ids"}:
                  raise ValueError("campos")
              for campo in campos:
                  valor=ideia[campo]
                  minimo=5 if campo in ("titulo","frase_thumbnail") else 10
                  if not isinstance(valor,str) or not minimo<=len(valor.strip())<=1000:
                      raise ValueError("campo "+campo)
              if "hipótese" not in ideia["emocao_hipotese"].casefold():
                  raise ValueError("hipotese")
              refs=ideia["fontes_ids"]
              if not isinstance(refs,list) or not 1<=len(refs)<=3 or len(refs)!=len(set(refs)) or any(x not in ids for x in refs):
                  raise ValueError("referencias")
          except (ValueError,KeyError,IndexError,TypeError) as e:
              sys.exit("FALHA VALIDACAO: "+type(e).__name__+" "+str(e)[:100])
          print("SUCESSO: 1 ideia completa, 11 campos e fontes_ids validados.")
          print("Teste sintetico; qualidade editorial ainda nao avaliada.")
          PY
